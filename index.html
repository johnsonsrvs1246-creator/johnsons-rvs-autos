<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory – Johnson's RV & Auto Sales LLC</title>

    <style>
        body { margin:0; font-family:Arial; background:#f7f7f7; color:#222; }
        nav { background:#1a1a1a; padding:14px 0; text-align:center; }
        nav a { color:white; margin:0 20px; text-decoration:none; font-size:18px; font-weight:bold; }
        nav a:hover { color:#ffcc00; }

        .container { width:90%; max-width:1100px; margin:30px auto; background:white; padding:25px; border-radius:8px; box-shadow:0 0 10px #ccc; }
        h1, h2 { text-align:center; }

        .slider-section { margin:40px auto; width:100%; max-width:1100px; }
        .slider-title { font-size:24px; font-weight:bold; margin-bottom:15px; text-align:center; }
        .slider-box { position:relative; overflow:hidden; border-radius:10px; background:white; box-shadow:0 0 10px #ccc; }
        .slider { display:flex; transition:transform 0.5s ease; }
        .slider img { width:100%; height:300px; object-fit:cover; }
        .arrow { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.4); color:white; padding:10px; cursor:pointer; font-size:22px; border-radius:50%; }
        .arrow-left { left:10px; }
        .arrow-right { right:10px; }

        .social-bar { text-align:center; margin:40px 0; }
        .social-bar img { width:42px; margin:0 15px; transition:0.2s; }
        .social-bar img:hover { transform:scale(1.15); }

        footer { background:#1a1a1a; color:white; text-align:center; padding:18px; margin-top:40px; }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="inventory.html">Inventory</a>
    <a href="units.html">Units</a>
    <a href="autos.html">Autos</a>
    <a href="repairs.html">Repairs</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">
    <h1>Full Inventory</h1>
    <p style="text-align:center; font-size:18px;">Browse all available RVs, Autos, Campers, and Boats.</p>

    <!-- RVs -->
    <div class="slider-section">
        <div class="slider-title">RVs</div>
        <div class="slider-box">
            <div class="slider" id="slider-rvs">
                <img src="images/placeholder1.jpg">
                <img src="images/placeholder2.jpg">
                <img src="images/placeholder3.jpg">
            </div>
            <div class="arrow arrow-left" onclick="moveSlide('rvs', -1)">❮</div>
            <div class="arrow arrow-right" onclick="moveSlide('rvs', 1)">❯</div>
        </div>
    </div>

    <!-- Autos -->
    <div class="slider-section">
        <div class="slider-title">Autos</div>
        <div class="slider-box">
            <div class="slider" id="slider-autos">
                <img src="images/placeholder1.jpg">
                <img src="images/placeholder2.jpg">
                <img src="images/placeholder3.jpg">
            </div>
            <div class="arrow arrow-left" onclick="moveSlide('autos', -1)">❮</div>
            <div class="arrow arrow-right" onclick="moveSlide('autos', 1)">❯</div>
        </div>
    </div>

    <!-- Campers -->
    <div class="slider-section">
        <div class="slider-title">Campers</div>
        <div class="slider-box">
            <div class="slider" id="slider-campers">
                <img src="images/placeholder1.jpg">
                <img src="images/placeholder2.jpg">
                <img src="images/placeholder3.jpg">
            </div>
            <div class="arrow arrow-left" onclick="moveSlide('campers', -1)">❮</div>
            <div class="arrow arrow-right" onclick="moveSlide('campers', 1)">❯</div>
        </div>
    </div>

    <!-- Boats -->
    <div class="slider-section">
        <div class="slider-title">Boats</div>
        <div class="slider-box">
            <div class="slider" id="slider-boats">
                <img src="images/placeholder1.jpg">
                <img src="images/placeholder2.jpg">
                <img src="images/placeholder3.jpg">
            </div>
            <div class="arrow arrow-left" onclick="moveSlide('boats', -1)">❮</div>
            <div class="arrow arrow-right" onclick="moveSlide('boats', 1)">❯</div>
        </div>
    </div>

</div>

<div class="social-bar">
    <a href="https://www.facebook.com/profile.php?id=61591545535492" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
    </a>
    <a href="https://www.instagram.com" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
    </a>
    <a href="https://maps.google.com/?q=Johnson's+RV+and+Auto+Sales+LLC" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">
    </a>
    <a href="tel:7045602552">
        <img src="https://cdn-icons-png.flaticon.com/512/724/724664.png">
    </a>
</div>

<footer>
    Johnson's RV & Auto Sales LLC • Marshville, NC • 704‑560‑2552
</footer>

<script>
    const positions = { rvs:0, autos:0, campers:0, boats:0 };

    function moveSlide(type, direction) {
        const slider = document.getElementById(`slider-${type}`);
        const total = slider.children.length;
        positions[type] = (positions[type] + direction + total) % total;
        slider.style.transform = `translateX(-${positions[type] * 100}%)`;
    }

    setInterval(() => moveSlide('rvs', 1), 4000);
    setInterval(() => moveSlide('autos', 1), 4000);
    setInterval(() => moveSlide('campers', 1), 4000);
    setInterval(() => moveSlide('boats', 1), 4000);
</script>

</body>
</html>
